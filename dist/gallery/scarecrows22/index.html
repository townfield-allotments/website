</div> </div>  <script>(function(){const images = [];

    let currentIndex = 0;
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const counter = document.getElementById("lightbox-counter");

    // Make functions globally available
    window.openLightbox = function (el) {
      if (!el || !el.dataset) return;
      currentIndex = parseInt(el.dataset.index) || 0;
      updateLightbox();
      lightbox.style.display = "flex";
      document.body.style.overflow = "hidden";
    };

    window.closeLightbox = function () {
      lightbox.style.display = "none";
      document.body.style.overflow = "";
    };

    window.nextImage = function () {
      if (images.length === 0) return;
      currentIndex = (currentIndex + 1) % images.length;
      updateLightbox();
    };

    window.prevImage = function () {
      if (images.length === 0) return;
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateLightbox();
    };

    function updateLightbox() {
      if (!images[currentIndex]) return;
      lightboxImg.src = images[currentIndex].src;
      lightboxImg.alt = images[currentIndex].alt || "photo";
      counter.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    // Close lightbox when clicking outside image
    if (lightbox) {
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
          window.closeLightbox();
        }
      });
    }

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (!lightbox || lightbox.style.display !== "flex") return;
      if (e.key === "ArrowRight") window.nextImage();
      if (e.key === "ArrowLeft") window.prevImage();
      if (e.key === "Escape") window.closeLightbox();
    });
  })();</script>  </main> <!-- FOOTER --> <footer class="footer" data-astro-cid-sckkx6r4> <div class="footer-container" data-astro-cid-sckkx6r4> <p data-astro-cid-sckkx6r4>
